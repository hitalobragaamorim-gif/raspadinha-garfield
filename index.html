<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Raspadinha Garfield Pizzaria</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  font-family: Arial, sans-serif;
  background: linear-gradient(180deg, #ffb300, #ff7a00);
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 20px;
}

.container {
  width: 100%;
  max-width: 420px;
  background: #fff8df;
  border-radius: 25px;
  padding: 25px 20px;
  text-align: center;
  box-shadow: 0 10px 30px rgba(0,0,0,.25);
}

h1 {
  color: #e85d04;
  margin: 0;
}

.logo {
  font-size: 55px;
}

.raspadinha {
  position: relative;
  width: 100%;
  height: 190px;
  margin: 20px auto;
  border-radius: 18px;
  overflow: hidden;
  background: white;
  border: 4px solid #e85d04;
}

#resultado {
  width: 100%;
  height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  font-size: 21px;
  font-weight: bold;
  color: #e85d04;
  text-align: center;
}

canvas {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  touch-action: none;
}

button {
  width: 100%;
  border: 0;
  border-radius: 12px;
  padding: 15px;
  margin-top: 10px;
  font-size: 18px;
  font-weight: bold;
  cursor: pointer;
}

#revelar {
  background: #e85d04;
  color: white;
}

#whatsapp {
  display: none;
  background: #25D366;
  color: white;
}

.codigo {
  display: none;
  background: white;
  border: 2px dashed #e85d04;
  padding: 12px;
  margin-top: 15px;
  border-radius: 12px;
  font-size: 20px;
  font-weight: bold;
}

.aviso {
  color: #777;
  font-size: 13px;
  margin-top: 15px;
}
</style>
</head>

<body>

<div class="container">

  <div class="logo">🍕🐱</div>

  <h1>GARFIELD PIZZARIA</h1>

  <h2>🎟️ Raspadinha Premiada</h2>

  <p>Raspe para descobrir seu prêmio!</p>

  <div class="raspadinha">

    <div id="resultado">
      Verificando sua raspadinha...
    </div>

    <canvas id="canvas"></canvas>

  </div>

  <button id="revelar">
    ✨ REVELAR MEU PRÊMIO
  </button>

  <div id="codigo" class="codigo"></div>

  <button id="whatsapp">
    📲 ENVIAR PELO WHATSAPP
  </button>

  <div class="aviso">
    Esta raspadinha é válida uma única vez.<br>
    Faça uma nova compra para receber uma nova raspadinha.
  </div>

</div>

<script>

const SUPABASE_URL =
"https://wbsabsmgyxbalqmmssxd.supabase.co";

const SUPABASE_KEY =
"sb_publishable_3t4uoXlM7W2lSzyTBMoW4w_BXs2usXz";

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

const resultado = document.getElementById("resultado");
const codigoDiv = document.getElementById("codigo");
const revelar = document.getElementById("revelar");
const whatsapp = document.getElementById("whatsapp");

let dados = null;
let raspado = false;


/* PEGAR CÓDIGO DO LINK */

const parametros = new URLSearchParams(window.location.search);

const codigoRaspadinha = parametros.get("codigo");


/* SE NÃO EXISTIR CÓDIGO */

if (!codigoRaspadinha) {

  resultado.innerText =
  "❌ Esta raspadinha não possui um código válido.";

  revelar.style.display = "none";

}


/* TAMANHO DA RASPADINHA */

function ajustarCanvas() {

  const rect = canvas.getBoundingClientRect();

  canvas.width = rect.width;
  canvas.height = rect.height;

  ctx.globalCompositeOperation = "source-over";

  ctx.fillStyle = "#bdbdbd";

  ctx.fillRect(
    0,
    0,
    canvas.width,
    canvas.height
  );

  ctx.fillStyle = "#666";

  ctx.font = "bold 24px Arial";

  ctx.textAlign = "center";

  ctx.fillText(
    "RASPE AQUI 🎟️",
    canvas.width / 2,
    canvas.height / 2
  );
}


/* CONSULTAR RASPADINHA */

async function carregarRaspadinha() {

  try {

    const resposta = await fetch(
      SUPABASE_URL +
      "/rest/v1/cupons?codigo=eq." +
      encodeURIComponent(codigoRaspadinha) +
      "&select=*",
      {
        headers: {
          "apikey": SUPABASE_KEY,
          "Authorization":
          "Bearer " + SUPABASE_KEY
        }
      }
    );

    const lista = await resposta.json();

    if (!lista.length) {

      resultado.innerText =
      "❌ Raspadinha inválida ou inexistente.";

      revelar.style.display = "none";

      return;
    }

    const cupom = lista[0];

    dados = cupom;

    if (cupom.sorteado === true) {

      resultado.innerText =
      "Esta raspadinha já foi utilizada.";

      revelar.style.display = "none";

      return;
    }

    resultado.innerText =
    "Raspe para descobrir seu prêmio!";

  } catch (erro) {

    console.error(erro);

    resultado.innerText =
    "Erro ao conectar com a raspadinha.";
  }
}


/* RASPAR */

function raspar(x, y) {

  if (raspado || !dados) return;

  ctx.globalCompositeOperation =
  "destination-out";

  ctx.beginPath();

  ctx.arc(
    x,
    y,
    25,
    0,
    Math.PI * 2
  );

  ctx.fill();
}


/* VERIFICAR QUANTO FOI RASPADO */

function verificarRevelacao() {

  const imagem =
  ctx.getImageData(
    0,
    0,
    canvas.width,
    canvas.height
  );

  let apagados = 0;

  for (
    let i = 3;
    i < imagem.data.length;
    i += 4
  ) {

    if (imagem.data[i] < 100) {
      apagados++;
    }
  }

  const porcentagem =
  apagados /
  (imagem.data.length / 4);

  if (porcentagem > 0.45) {

    finalizarRaspadinha();

  }
}


/* FINALIZAR */

async function finalizarRaspadinha() {

  if (raspado || !dados) return;

  raspado = true;

  try {

    const resposta =
    await fetch(
      SUPABASE_URL +
      "/rest/v1/rpc/gerar_premio_cupom",
      {
        method: "POST",

        headers: {
          "Content-Type":
          "application/json",

          "apikey":
          SUPABASE_KEY,

          "Authorization":
          "Bearer " + SUPABASE_KEY
        },

        body: JSON.stringify({
          codigo_cupom:
          codigoRaspadinha
        })
      }
    );

    const resultadoServidor =
    await resposta.json();

    if (!resultadoServidor.sucesso) {

      resultado.innerText =
      resultadoServidor.mensagem ||
      "Não foi possível revelar.";

      return;
    }

    dados = resultadoServidor;

    ctx.clearRect(
      0,
      0,
      canvas.width,
      canvas.height
    );

    resultado.innerText =
    resultadoServidor.premio;

    codigoDiv.style.display = "block";

    codigoDiv.innerText =
    "CÓDIGO: " +
    resultadoServidor.codigo;

    revelar.style.display = "none";

    whatsapp.style.display = "block";

  } catch (erro) {

    console.error(erro);

    resultado.innerText =
    "Erro ao revelar a raspadinha.";
  }
}


/* BOTÃO REVELAR */

revelar.addEventListener(
  "click",
  finalizarRaspadinha
);


/* MOUSE */

canvas.addEventListener(
  "mousemove",
  function(e) {

    if (e.buttons !== 1) return;

    const rect =
    canvas.getBoundingClientRect();

    raspar(
      e.clientX - rect.left,
      e.clientY - rect.top
    );

    verificarRevelacao();
  }
);


/* MOUSE CLIQUE */

canvas.addEventListener(
  "mousedown",
  function(e) {

    const rect =
    canvas.getBoundingClientRect();

    raspar(
      e.clientX - rect.left,
      e.clientY - rect.top
    );
  }
);


/* CELULAR */

canvas.addEventListener(
  "touchmove",
  function(e) {

    e.preventDefault();

    const rect =
    canvas.getBoundingClientRect();

    const toque =
    e.touches[0];

    raspar(
      toque.clientX - rect.left,
      toque.clientY - rect.top
    );

    verificarRevelacao();

  },
  { passive: false }
);


/* WHATSAPP */

whatsapp.addEventListener(
  "click",
  function() {

    const mensagem =
    "🍕 GARFIELD PIZZARIA 🐱\n\n" +
    "🎟️ Minha raspadinha:\n" +
    dados.premio +
    "\n\n🔑 Código: " +
    dados.codigo +
    "\n\nQuero usar meu prêmio!";

    window.open(
      "https://wa.me/?text=" +
      encodeURIComponent(mensagem),
      "_blank"
    );

  }
);


/* INICIAR */

ajustarCanvas();

if (codigoRaspadinha) {
  carregarRaspadinha();
}

</script>

</body>
</html>
