<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Raspadinha Garfield Pizzaria</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  font-family: Arial, sans-serif;
  background: linear-gradient(180deg, #ffb300, #ff7a00);
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 20px;
}

.container {
  width: 100%;
  max-width: 420px;
  background: #fff8df;
  border-radius: 25px;
  padding: 25px 20px;
  text-align: center;
  box-shadow: 0 10px 30px rgba(0,0,0,.25);
}

.logo {
  font-size: 55px;
}

h1 {
  margin: 0;
  color: #e85d04;
  font-size: 30px;
}

h2 {
  color: #222;
}

p {
  color: #555;
}

.raspadinha {
  position: relative;
  width: 100%;
  height: 190px;
  margin: 20px auto;
  border-radius: 18px;
  overflow: hidden;
  background: white;
  border: 4px solid #e85d04;
}

#resultado {
  width: 100%;
  height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  font-size: 20px;
  font-weight: bold;
  color: #e85d04;
  text-align: center;
}

canvas {
  position: absolute;
  left: 0;
  top: 0;
  width: 100%;
  height: 100%;
  cursor: pointer;
  touch-action: none;
}

button {
  width: 100%;
  border: 0;
  border-radius: 12px;
  padding: 15px;
  margin-top: 10px;
  font-size: 18px;
  font-weight: bold;
  cursor: pointer;
}

#revelar {
  background: #e85d04;
  color: white;
}

#whatsapp {
  display: none;
  background: #25D366;
  color: white;
}

.codigo {
  display: none;
  margin-top: 15px;
  padding: 12px;
  background: white;
  border: 2px dashed #e85d04;
  border-radius: 12px;
  font-size: 19px;
  font-weight: bold;
}

.aviso {
  margin-top: 15px;
  font-size: 13px;
  color: #777;
}
</style>
</head>

<body>

<div class="container">

  <div class="logo">🍕🐱</div>

  <h1>GARFIELD PIZZARIA</h1>

  <h2>🎟️ Raspadinha Premiada</h2>

  <p>Raspe a área abaixo para descobrir seu prêmio!</p>

  <div class="raspadinha">

    <div id="resultado">
      🎁 RASPE AQUI E DESCUBRA SEU PRÊMIO!
    </div>

    <canvas id="canvas"></canvas>

  </div>

  <button id="revelar">
    ✨ REVELAR MEU PRÊMIO
  </button>

  <div id="codigo" class="codigo"></div>

  <button id="whatsapp">
    📲 ENVIAR PELO WHATSAPP
  </button>

  <div class="aviso">
    Esta raspadinha só pode ser utilizada uma vez.<br>
    Faça outra compra para receber uma nova.
  </div>

</div>

<script>

const SUPABASE_URL =
"https://wbsabsmgyxbalqmmssxd.supabase.co";

const SUPABASE_KEY =
"sb_publishable_3t4uoXlM7W2lSzyTBMoW4w_BXs2usXz";


const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

const resultado = document.getElementById("resultado");
const revelar = document.getElementById("revelar");
const codigoDiv = document.getElementById("codigo");
const whatsapp = document.getElementById("whatsapp");


/* CÓDIGO DO LINK */

const parametros =
new URLSearchParams(window.location.search);

const codigoRaspadinha =
parametros.get("codigo");


/* CONFIGURAR RASPADINHA */

function configurarCanvas() {

  const largura =
  canvas.parentElement.clientWidth;

  const altura =
  canvas.parentElement.clientHeight;

  canvas.width = largura;
  canvas.height = altura;

  ctx.globalCompositeOperation =
  "source-over";

  ctx.fillStyle = "#bdbdbd";

  ctx.fillRect(
    0,
    0,
    largura,
    altura
  );

  ctx.fillStyle = "#666";

  ctx.font = "bold 24px Arial";

  ctx.textAlign = "center";

  ctx.textBaseline = "middle";

  ctx.fillText(
    "RASPE AQUI 🎟️",
    largura / 2,
    altura / 2
  );
}


/* MOSTRAR RESULTADO JÁ UTILIZADO */

function mostrarResultadoAnterior(dados) {

  ctx.clearRect(
    0,
    0,
    canvas.width,
    canvas.height
  );

  resultado.innerText =
  dados.premio;

  codigoDiv.style.display =
  "block";

  codigoDiv.innerText =
  "🎟️ CÓDIGO: " +
  dados.codigo;

  revelar.style.display =
  "none";

  whatsapp.style.display =
  "block";

  configurarWhatsApp(dados);
}


/* WHATSAPP */

function configurarWhatsApp(dados) {

  whatsapp.onclick =
  function() {

    const mensagem =
    "🍕 GARFIELD PIZZARIA 🐱\n\n" +
    "🎟️ Minha raspadinha deu:\n" +
    dados.premio +
    "\n\n🔑 Código: " +
    dados.codigo +
    "\n\nQuero usar meu prêmio!";

    window.open(
      "https://wa.me/?text=" +
      encodeURIComponent(mensagem),
      "_blank"
    );
  };
}


/* VERIFICAR SE A RASPADINHA JÁ FOI USADA */

async function verificarRaspadinha() {

  if (!codigoRaspadinha) {

    resultado.innerText =
    "❌ Link de raspadinha inválido.";

    revelar.style.display =
    "none";

    return;
  }

  try {

    const resposta =
    await fetch(
      SUPABASE_URL +
      "/rest/v1/rpc/consultar_raspadinha",
      {
        method: "POST",

        headers: {
          "Content-Type":
          "application/json",

          "apikey":
          SUPABASE_KEY,

          "Authorization":
          "Bearer " + SUPABASE_KEY
        },

        body: JSON.stringify({
          codigo_cupom:
          codigoRaspadinha
        })
      }
    );


    const dados =
    await resposta.json();


    if (!resposta.ok) {

      console.error(dados);

      throw new Error(
        JSON.stringify(dados)
      );
    }


    /* CÓDIGO JÁ UTILIZADO */

    if (dados.usado === true) {

      mostrarResultadoAnterior(
        dados
      );

      return;
    }


    /* CÓDIGO AINDA NÃO UTILIZADO */

    resultado.innerText =
    "🎁 RASPE AQUI E DESCUBRA SEU PRÊMIO!";

  } catch (erro) {

    console.error(erro);

    resultado.innerText =
    "❌ Não foi possível verificar esta raspadinha.";

    revelar.style.display =
    "none";
  }
}


/* RASPAR */

function raspar(x, y) {

  ctx.globalCompositeOperation =
  "destination-out";

  ctx.beginPath();

  ctx.arc(
    x,
    y,
    25,
    0,
    Math.PI * 2
  );

  ctx.fill();
}


/* MOUSE */

canvas.addEventListener(
  "mousedown",
  function(e) {

    const rect =
    canvas.getBoundingClientRect();

    raspar(
      e.clientX - rect.left,
      e.clientY - rect.top
    );
  }
);


canvas.addEventListener(
  "mousemove",
  function(e) {

    if (e.buttons !== 1) return;

    const rect =
    canvas.getBoundingClientRect();

    raspar(
      e.clientX - rect.left,
      e.clientY - rect.top
    );
  }
);


/* CELULAR */

canvas.addEventListener(
  "touchstart",
  function(e) {

    e.preventDefault();

    const rect =
    canvas.getBoundingClientRect();

    const toque =
    e.touches[0];

    raspar(
      toque.clientX - rect.left,
      toque.clientY - rect.top
    );
  },
  { passive: false }
);


canvas.addEventListener(
  "touchmove",
  function(e) {

    e.preventDefault();

    const rect =
    canvas.getBoundingClientRect();

    const toque =
    e.touches[0];

    raspar(
      toque.clientX - rect.left,
      toque.clientY - rect.top
    );
  },
  { passive: false }
);


/* REVELAR PRÊMIO */

async function revelarPremio() {

  if (!codigoRaspadinha) return;

  revelar.disabled =
  true;

  revelar.innerText =
  "⏳ Revelando...";


  try {

    const resposta =
    await fetch(
      SUPABASE_URL +
      "/rest/v1/rpc/gerar_premio_cupom",
      {
        method: "POST",

        headers: {
          "Content-Type":
          "application/json",

          "apikey":
          SUPABASE_KEY,

          "Authorization":
          "Bearer " + SUPABASE_KEY
        },

        body: JSON.stringify({
          codigo_cupom:
          codigoRaspadinha
        })
      }
    );


    const dados =
    await resposta.json();


    if (!resposta.ok) {

      throw new Error(
        JSON.stringify(dados)
      );
    }


    if (!dados.sucesso) {

      resultado.innerText =
      dados.mensagem ||
      "Esta raspadinha já foi utilizada.";

      revelar.style.display =
      "none";

      return;
    }


    /* MOSTRAR O PRÊMIO */

    ctx.clearRect(
      0,
      0,
      canvas.width,
      canvas.height
    );

    resultado.innerText =
    dados.premio;


    codigoDiv.style.display =
    "block";

    codigoDiv.innerText =
    "🎟️ CÓDIGO: " +
    dados.codigo;


    revelar.style.display =
    "none";

    whatsapp.style.display =
    "block";

    configurarWhatsApp(
      dados
    );


  } catch (erro) {

    console.error(erro);

    resultado.innerText =
    "❌ Erro ao revelar. Tente novamente.";

    revelar.disabled =
    false;

    revelar.innerText =
    "✨ REVELAR MEU PRÊMIO";
  }
}


/* BOTÃO REVELAR */

revelar.addEventListener(
  "click",
  revelarPremio
);


/* INICIAR */

async function iniciar() {

  configurarCanvas();

  await verificarRaspadinha();
}

iniciar();


window.addEventListener(
  "resize",
  configurarCanvas
);

</script>

</body>
</html>
