<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Raspadinha Garfield Pizzaria</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: linear-gradient(180deg, #ffb300, #ff7a00);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 420px;
      background: #fff8df;
      border-radius: 25px;
      padding: 25px 20px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.25);
    }

    h1 {
      margin: 0;
      color: #e85d04;
      font-size: 32px;
    }

    .pizza {
      font-size: 55px;
      margin: 8px 0;
    }

    h2 {
      margin: 5px 0 10px;
      color: #222;
    }

    p {
      color: #555;
    }

    .raspadinha {
      position: relative;
      width: 100%;
      height: 190px;
      margin: 20px auto;
      border-radius: 18px;
      overflow: hidden;
      background: white;
      border: 4px solid #e85d04;
    }

    #resultado {
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      font-size: 21px;
      font-weight: bold;
      color: #e85d04;
      text-align: center;
    }

    canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      cursor: pointer;
      touch-action: none;
    }

    button {
      width: 100%;
      border: 0;
      border-radius: 12px;
      padding: 15px;
      margin-top: 10px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
    }

    #revelar {
      background: #e85d04;
      color: white;
    }

    #whatsapp {
      display: none;
      background: #25D366;
      color: white;
    }

    .codigo {
      display: none;
      background: #fff;
      border: 2px dashed #e85d04;
      padding: 12px;
      margin-top: 15px;
      border-radius: 12px;
      font-size: 20px;
      font-weight: bold;
      letter-spacing: 2px;
    }

    .rodape {
      margin-top: 15px;
      font-size: 13px;
      color: #777;
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="pizza">🍕🐱</div>

    <h1>GARFIELD PIZZARIA</h1>

    <h2>🎟️ Raspadinha Premiada</h2>

    <p>Raspe a área abaixo e descubra se você ganhou!</p>

    <div class="raspadinha">

      <div id="resultado">
        Carregando seu prêmio...
      </div>

      <canvas id="canvas"></canvas>

    </div>

    <button id="revelar">
      ✨ REVELAR MEU PRÊMIO
    </button>

    <div id="codigo" class="codigo"></div>

    <button id="whatsapp">
      📲 ENVIAR PELO WHATSAPP
    </button>

    <div class="rodape">
      Garfield Pizzaria 🍕<br>
      Continue comprando para adquirir novas raspadinhas!
    </div>

  </div>


<script>

  /* ================================
     CONFIGURAÇÃO DO SUPABASE
  ================================= */

  const SUPABASE_URL =
    "https://wbsabsmgyxbalqmmssxd.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_3t4uoXlM7W2lSzyTBMoW4w_BXs2usXz";


  /* ================================
     ELEMENTOS
  ================================= */

  const canvas = document.getElementById("canvas");
  const ctx = canvas.getContext("2d");

  const resultado = document.getElementById("resultado");
  const codigo = document.getElementById("codigo");
  const revelar = document.getElementById("revelar");
  const whatsapp = document.getElementById("whatsapp");


  let dadosPremio = null;
  let revelado = false;


  /* ================================
     TAMANHO DA RASPADINHA
  ================================= */

  function ajustarCanvas() {

    const rect = canvas.getBoundingClientRect();

    canvas.width = rect.width;
    canvas.height = rect.height;

    ctx.fillStyle = "#bdbdbd";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.fillStyle = "#777";
    ctx.font = "bold 24px Arial";
    ctx.textAlign = "center";

    ctx.fillText(
      "RASPE AQUI 🎟️",
      canvas.width / 2,
      canvas.height / 2
    );
  }


  window.addEventListener("resize", ajustarCanvas);


  /* ================================
     BUSCAR PRÊMIO NO SUPABASE
  ================================= */

  async function buscarPremio() {

    try {

      const resposta = await fetch(
        SUPABASE_URL + "/rest/v1/rpc/gerar_raspadinha",
        {
          method: "POST",

          headers: {
            "Content-Type": "application/json",
            "apikey": SUPABASE_KEY,
            "Authorization": "Bearer " + SUPABASE_KEY
          },

          body: "{}"
        }
      );


      if (!resposta.ok) {
        throw new Error("Erro ao gerar raspadinha");
      }


      dadosPremio = await resposta.json();


      if (!dadosPremio.sucesso) {

        resultado.innerText =
          "Não foi possível gerar sua raspadinha.";

        return;
      }


      resultado.innerText = dadosPremio.premio;


    } catch (erro) {

      console.error(erro);

      resultado.innerText =
        "Erro ao conectar com a raspadinha.";
    }
  }


  /* ================================
     RASPAGEM
  ================================= */

  function raspar(x, y) {

    if (revelado) return;

    ctx.globalCompositeOperation = "destination-out";

    ctx.beginPath();
    ctx.arc(x, y, 25, 0, Math.PI * 2);
    ctx.fill();

  }


  function verificarRevelacao() {

    const imagem =
      ctx.getImageData(
        0,
        0,
        canvas.width,
        canvas.height
      );

    let apagados = 0;

    for (let i = 3; i < imagem.data.length; i += 4) {

      if (imagem.data[i] < 100) {
        apagados++;
      }

    }

    const porcentagem =
      apagados / (imagem.data.length / 4);


    if (porcentagem > 0.45) {
      revelarPremio();
    }
  }


  /* ================================
     REVELAR PRÊMIO
  ================================= */

  function revelarPremio() {

    if (revelado) return;

    revelado = true;

    ctx.clearRect(
      0,
      0,
      canvas.width,
      canvas.height
    );

    revelar.style.display = "none";


    if (!dadosPremio) return;


    codigo.style.display = "block";

    codigo.innerHTML =
      "CÓDIGO: " + dadosPremio.codigo;


    whatsapp.style.display = "block";


    whatsapp.onclick = function() {

      const mensagem =
        "🍕 GARFIELD PIZZARIA 🐱%0A%0A" +
        "🎟️ Minha raspadinha deu:%0A" +
        dadosPremio.premio +
        "%0A%0A" +
        "🔑 Código: " +
        dadosPremio.codigo +
        "%0A%0A" +
        "Quero usar meu prêmio!";


      window.open(
        "https://wa.me/?text=" + mensagem,
        "_blank"
      );

    };

  }


  /* ================================
     MOUSE
  ================================= */

  canvas.addEventListener("mousemove", function(e) {

    if (e.buttons !== 1) return;

    const rect = canvas.getBoundingClientRect();

    raspar(
      e.clientX - rect.left,
      e.clientY - rect.top
    );

    verificarRevelacao();

  });


  canvas.addEventListener("mousedown", function(e) {

    const rect = canvas.getBoundingClientRect();

    raspar(
      e.clientX - rect.left,
      e.clientY - rect.top
    );

  });


  /* ================================
     CELULAR
  ================================= */

  canvas.addEventListener("touchmove", function(e) {

    e.preventDefault();

    const rect = canvas.getBoundingClientRect();

    const toque = e.touches[0];

    raspar(
      toque.clientX - rect.left,
      toque.clientY - rect.top
    );

    verificarRevelacao();

  });


  canvas.addEventListener("touchstart", function(e) {

    const rect = canvas.getBoundingClientRect();

    const toque = e.touches[0];

    raspar(
      toque.clientX - rect.left,
      toque.clientY - rect.top
    );

  });


  /* ================================
     BOTÃO REVELAR
  ================================= */

  revelar.addEventListener("click", revelarPremio);


  /* ================================
     INICIAR
  ================================= */

  ajustarCanvas();

  buscarPremio();

</script>

</body>
</html>
