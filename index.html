<body>

<script>

/* ==========================
   SUPABASE
========================== */

const SUPABASE_URL =
"https://wbsabsmgyxbalqmmssxd.supabase.co";

/*
COLE AQUI A SUA CHAVE PUBLICÁVEL
Ela começa com sb_publishable_
*/

const SUPABASE_KEY =
"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZjeXljdXNxd3lsdm5vd2t4eHF2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY4MTkxNjMsImV4cCI6MjEwMjM5NTE2M30.MS6jgAa0m7xm4GRWmZrP7TAgjlrY07CvPT_BFvbp0v4";


/* ==========================
   ELEMENTOS
========================== */

const canvas =
document.getElementById("canvas");

const ctx =
canvas.getContext("2d");

const resultado =
document.getElementById("resultado");

const revelar =
document.getElementById("revelar");

const codigoDiv =
document.getElementById("codigo");

const whatsapp =
document.getElementById("whatsapp");


/* ==========================
   CÓDIGO DA URL
========================== */

const parametros =
new URLSearchParams(
window.location.search
);

const codigoRaspadinha =
parametros.get("codigo");


/* ==========================
   CANVAS
========================== */

function configurarCanvas(){

const largura =
canvas.parentElement.clientWidth;

const altura =
canvas.parentElement.clientHeight;

canvas.width=largura;
canvas.height=altura;

ctx.globalCompositeOperation="source-over";

ctx.fillStyle="#bdbdbd";

ctx.fillRect(
0,
0,
largura,
altura
);

ctx.fillStyle="#666";

ctx.font="bold 24px Arial";

ctx.textAlign="center";

ctx.textBaseline="middle";

ctx.fillText(
"RASPE AQUI 🎟️",
largura/2,
altura/2
);
}


/* ==========================
   MOSTRAR RESULTADO USADO
========================== */

function mostrarResultadoAnterior(dados){

ctx.clearRect(
0,
0,
canvas.width,
canvas.height
);

resultado.innerText =
dados.premio ||
"Esta raspadinha já foi utilizada.";

codigoDiv.style.display="block";

codigoDiv.innerText =
"🎟️ CÓDIGO: "+
dados.codigo;

revelar.style.display="none";

whatsapp.style.display="block";

configurarWhatsApp(dados);
}


/* ==========================
   WHATSAPP
========================== */

function configurarWhatsApp(dados){

whatsapp.onclick=function(){

const mensagem =
"🍕 GARFIELD PIZZARIA 🐱\n\n"+
"🎟️ Minha raspadinha deu:\n"+
dados.premio+
"\n\n🔑 Código: "+
dados.codigo+
"\n\nQuero usar meu prêmio!";

window.open(
"https://wa.me/?text="+
encodeURIComponent(mensagem),
"_blank"
);

};
}


/* ==========================
   CONSULTAR RASPADINHA
========================== */

async function verificarRaspadinha(){

if(!codigoRaspadinha){

resultado.innerText =
"❌ Link de raspadinha inválido.";

revelar.style.display="none";

return;
}

try{

const resposta =
await fetch(
SUPABASE_URL+
"/rest/v1/rpc/consultar_raspadinha",
{
method:"POST",

headers:{
"Content-Type":"application/json",
"apikey":SUPABASE_KEY,
"Authorization":
"Bearer "+SUPABASE_KEY
},

body:JSON.stringify({
codigo_cupom:
codigoRaspadinha
})
}
);

const texto =
await resposta.text();

console.log(
"Resposta Supabase:",
texto
);

if(!resposta.ok){

throw new Error(
"Erro HTTP "+
resposta.status+
": "+
texto
);
}

const bruto =
JSON.parse(texto);

const dados =
Array.isArray(bruto)
? bruto[0]
: bruto;

console.log(
"Dados:",
dados
);

if(
!dados ||
typeof dados.usado==="undefined"
){

throw new Error(
"Resposta inválida: "+
JSON.stringify(bruto)
);
}

if(dados.usado===true){

mostrarResultadoAnterior(
dados
);

return;
}

resultado.innerText =
"🎁 RASPE AQUI E DESCUBRA SEU PRÊMIO!";

revelar.style.display="block";

}catch(erro){

console.error(
"Erro ao consultar:",
erro
);

resultado.innerText =
"❌ Não foi possível verificar esta raspadinha.";

revelar.style.display="none";
}
}


/* ==========================
   RASPAR
========================== */

function raspar(x,y){

ctx.globalCompositeOperation =
"destination-out";

ctx.beginPath();

ctx.arc(
x,
y,
25,
0,
Math.PI*2
);

ctx.fill();
}


/* ==========================
   MOUSE
========================== */

canvas.addEventListener(
"mousedown",
function(e){

const rect =
canvas.getBoundingClientRect();

raspar(
e.clientX-rect.left,
e.clientY-rect.top
);

}
);


canvas.addEventListener(
"mousemove",
function(e){

if(e.buttons!==1)return;

const rect =
canvas.getBoundingClientRect();

raspar(
e.clientX-rect.left,
e.clientY-rect.top
);

}
);


/* ==========================
   CELULAR
========================== */

canvas.addEventListener(
"touchstart",
function(e){

e.preventDefault();

const rect =
canvas.getBoundingClientRect();

const toque =
e.touches[0];

raspar(
toque.clientX-rect.left,
toque.clientY-rect.top
);

},
{passive:false}
);


canvas.addEventListener(
"touchmove",
function(e){

e.preventDefault();

const rect =
canvas.getBoundingClientRect();

const toque =
e.touches[0];

raspar(
toque.clientX-rect.left,
toque.clientY-rect.top
);

},
{passive:false}
);


/* ==========================
   REVELAR PRÊMIO
========================== */

async function revelarPremio(){

if(!codigoRaspadinha)return;

revelar.disabled=true;

revelar.innerText =
"⏳ Revelando...";

try{

const resposta =
await fetch(
SUPABASE_URL+
"/rest/v1/rpc/gerar_premio_cupom",
{
method:"POST",

headers:{
"Content-Type":"application/json",
"apikey":SUPABASE_KEY,
"Authorization":
"Bearer "+SUPABASE_KEY
},

body:JSON.stringify({
codigo_cupom:
codigoRaspadinha
})
}
);

const texto =
await resposta.text();

console.log(
"Resposta sorteio:",
texto
);

if(!resposta.ok){

throw new Error(
"Erro HTTP "+
resposta.status+
": "+
texto
);
}

const bruto =
JSON.parse(texto);

const dados =
Array.isArray(bruto)
? bruto[0]
: bruto;

console.log(
"Resultado:",
dados
);

if(
!dados ||
dados.sucesso!==true
){

resultado.innerText =
dados &&
dados.mensagem
? dados.mensagem
: "Esta raspadinha já foi utilizada.";

revelar.style.display="none";

return;
}

ctx.clearRect(
0,
0,
canvas.width,
canvas.height
);

resultado.innerText =
dados.premio;

codigoDiv.style.display="block";

codigoDiv.innerText =
"🎟️ CÓDIGO: "+
dados.codigo;

revelar.style.display="none";

whatsapp.style.display="block";

configurarWhatsApp(
dados
);

}catch(erro){

console.error(
"Erro ao revelar:",
erro
);

resultado.innerText =
"❌ Erro ao revelar. Tente novamente.";

revelar.disabled=false;

revelar.innerText =
"✨ REVELAR MEU PRÊMIO";
}
}


/* ==========================
   BOTÃO
========================== */

revelar.addEventListener(
"click",
revelarPremio
);


/* ==========================
   INICIAR
========================== */

async function iniciar(){

configurarCanvas();

await verificarRaspadinha();

}

iniciar();

window.addEventListener(
"resize",
configurarCanvas
);

</script>

</body>
</html>
